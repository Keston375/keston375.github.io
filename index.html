<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mauricio Godoy — Software Engineer</title>
    <meta name="description" content="Mauricio Godoy (Keston) — Software Engineer and Full Stack Developer from Córdoba, Argentina. Explore my portfolio as a little pixel-art town." />
    <meta name="theme-color" content="#1a1423" />
    <meta property="og:title" content="Mauricio Godoy — Software Engineer" />
    <meta property="og:description" content="Explore my résumé as a pixel-art town." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://keston.xyz/" />
    <link rel="icon" href="/img/favicon.ico" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VLER53QJQC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-VLER53QJQC');
    </script>
  </head>
  <body>
    <canvas id="game" aria-label="Keston Town — an explorable pixel-art map of my résumé"></canvas>

    <div id="hud" class="hud" hidden></div>

    <div id="title" class="title-screen">
      <div class="title-card">
        <p class="title-kicker">✦ KESTON TOWN ✦</p>
        <h1>MAURICIO<br />GODOY</h1>
        <p class="title-role">&gt; <span id="typer"></span><span class="caret">_</span></p>
        <button id="start" class="pbtn big" type="button">▶ PRESS START</button>
        <button id="title-classic" class="linkbtn" type="button">or view the classic résumé</button>
      </div>
      <p class="title-foot">Explore the town to discover my experience, education and skills.</p>
    </div>

    <div id="panel" class="panel-backdrop" hidden>
      <section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <header class="panel-head">
          <span class="panel-icon" aria-hidden="true"></span>
          <h2 id="panel-title"></h2>
          <button class="panel-close" type="button" aria-label="Close">✕</button>
        </header>
        <div class="panel-body"></div>
        <footer class="panel-foot">Press <kbd>Esc</kbd> or ✕ to head back outside</footer>
      </section>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <main id="classic" class="classic" hidden></main>

    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Mauricio Godoy — Software Engineer. This site needs JavaScript;
        you can <a href="/files/Mauricio_Godoy_Resume.pdf">download my résumé (PDF)</a> instead.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
